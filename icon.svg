<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.6" />
  
  <!-- Workflow Connecting Wires -->
  <path d="M 140 180 C 230 180, 230 330, 320 330" fill="none" stroke="url(#wireGrad)" stroke-width="12" stroke-linecap="round" filter="url(#neon)" />
  <path d="M 140 330 C 230 330, 230 180, 320 180" fill="none" stroke="url(#wireGrad)" stroke-width="8" stroke-dasharray="12 8" stroke-linecap="round" opacity="0.7" />
  <path d="M 320 180 L 400 256" fill="none" stroke="url(#glowGrad)" stroke-width="10" stroke-linecap="round" filter="url(#neon)" />
  <path d="M 320 330 L 400 256" fill="none" stroke="url(#glowGrad)" stroke-width="10" stroke-linecap="round" filter="url(#neon)" />

  <!-- Node 1 (Input/Trigger) -->
  <circle cx="140" cy="180" r="38" fill="#0f172a" stroke="#06b6d4" stroke-width="8" filter="url(#neon)" />
  <circle cx="140" cy="180" r="16" fill="#06b6d4" />

  <!-- Node 2 (Condition/Branch) -->
  <circle cx="140" cy="330" r="38" fill="#0f172a" stroke="#3b82f6" stroke-width="8" />
  <circle cx="140" cy="330" r="16" fill="#3b82f6" />

  <!-- Node 3 (Transform/AI) -->
  <rect x="282" y="142" width="76" height="76" rx="20" fill="#0f172a" stroke="#8b5cf6" stroke-width="8" filter="url(#neon)" />
  <path d="M 320 162 L 332 178 L 320 194 L 308 178 Z" fill="#c084fc" />

  <!-- Node 4 (Action) -->
  <rect x="282" y="292" width="76" height="76" rx="20" fill="#0f172a" stroke="#ec4899" stroke-width="8" />
  <circle cx="320" cy="330" r="14" fill="#f43f5e" />

  <!-- Output Endpoint -->
  <circle cx="400" cy="256" r="32" fill="#0f172a" stroke="#10b981" stroke-width="8" filter="url(#neon)" />
  <circle cx="400" cy="256" r="12" fill="#10b981" />
  
  <!-- Subtle EIE Brand Signature -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="4">EIE-WORKFLOW</text>
</svg>
