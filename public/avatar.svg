<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="avBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="avGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Clip Path -->
  <clipPath id="avatarClip">
    <circle cx="128" cy="128" r="116" />
  </clipPath>

  <!-- Outer Glow Ring -->
  <circle cx="128" cy="128" r="124" fill="none" stroke="url(#glowBorder)" stroke-width="4" filter="url(#avGlow)" />
  
  <g clip-path="url(#avatarClip)">
    <!-- Background -->
    <rect width="256" height="256" fill="url(#avBg)" />
    
    <!-- Circuit grid lines in background -->
    <path d="M 40 0 V 256 M 80 0 V 256 M 120 0 V 256 M 160 0 V 256 M 200 0 V 256" stroke="#06b6d4" stroke-width="0.5" opacity="0.15" />
    <path d="M 0 60 H 256 M 0 120 H 256 M 0 180 H 256 M 0 220 H 256" stroke="#6366f1" stroke-width="0.5" opacity="0.15" />

    <!-- Ambient Neck / Shoulder Silhouette -->
    <path d="M 42 260 C 46 200, 85 180, 108 172 L 108 152 L 148 152 L 148 172 C 171 180, 210 200, 214 260 Z" fill="#1e293b" />
    <!-- Tech Suit Collar & Details -->
    <path d="M 96 260 L 116 195 L 140 195 L 160 260 Z" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" opacity="0.8" />
    <circle cx="128" cy="208" r="4" fill="#06b6d4" filter="url(#avGlow)" />

    <!-- Head & Neck -->
    <rect x="114" y="132" width="28" height="30" rx="6" fill="#fcd34d" opacity="0.85" />
    
    <!-- Head Base -->
    <ellipse cx="128" cy="106" rx="44" ry="52" fill="#fed7aa" />

    <!-- Hair Silhouette -->
    <path d="M 82 100 C 80 50, 110 40, 136 40 C 165 40, 178 55, 176 100 C 170 82, 160 76, 145 74 C 130 72, 110 75, 96 86 Z" fill="#0f172a" />
    <path d="M 80 95 C 78 80, 86 65, 102 54 C 120 42, 150 42, 168 56 C 176 63, 178 78, 178 92 C 172 84, 162 82, 150 82 C 132 82, 112 88, 96 102 Z" fill="#334155" />

    <!-- Futuristic Cybernetic AR Visor / Glasses -->
    <path d="M 92 100 Q 128 106 164 100 L 166 114 Q 128 122 90 114 Z" fill="url(#visorGrad)" opacity="0.95" filter="url(#avGlow)" />
    <line x1="86" y1="106" x2="170" y2="106" stroke="#ffffff" stroke-width="1" opacity="0.75" />
    <circle cx="108" cy="107" r="2.5" fill="#ffffff" />
    <circle cx="148" cy="107" r="2.5" fill="#ffffff" />

    <!-- Nose & Mouth subtle definition -->
    <path d="M 126 122 L 129 127 L 125 129" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M 118 139 Q 128 143 138 139" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Left Cyan Rim Lighting on Jaw -->
    <path d="M 85 108 C 87 142, 106 156, 128 158" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.7" filter="url(#avGlow)" />
  </g>
</svg>
